<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初中化学 · 方程式配对</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
  }

  /* 浮动分子装饰 */
  .molecule-bg {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .molecule-bg span {
    position: absolute;
    font-size: 24px;
    opacity: 0.06;
    animation: floatMolecule 20s infinite linear;
  }
  @keyframes floatMolecule {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.06; }
    90% { opacity: 0.06; }
    100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
  }

  .game-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 780px;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 32px;
    padding: 30px 28px 36px;
    border: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
  }

  /* -------- 顶部信息栏 -------- */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .header .title {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header .title .badge {
    font-size: 13px;
    background: rgba(255,200,50,0.2);
    color: #ffd866;
    padding: 2px 12px;
    border-radius: 20px;
    font-weight: 500;
  }
  .stats {
    display: flex;
    gap: 18px;
    color: rgba(255,255,255,0.7);
    font-size: 14px;
  }
  .stats span {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .stats .num { color: #fff; font-weight: 600; }

  /* -------- 进度条 -------- */
  .progress-wrap {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.12);
    border-radius: 4px;
    margin-bottom: 28px;
    overflow: hidden;
  }
  .progress-wrap .bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #f7971e, #ffd200);
    border-radius: 4px;
    transition: width 0.5s ease;
  }

  /* -------- 题目区 -------- */
  .question-area {
    text-align: center;
    margin-bottom: 28px;
  }
  .question-area .q-label {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 8px;
  }
  .question-area .q-text {
    font-size: 22px;
    font-weight: 600;
    color: #fff;
    line-height: 1.6;
  }
  .question-area .q-text .highlight {
    display: inline-block;
    background: linear-gradient(135deg, #f7971e, #ffd200);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 700;
  }
  .question-area .q-hint {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    margin-top: 6px;
  }
  .question-area .q-struct-img {
    margin: 12px auto 0;
    max-width: 120px;
    max-height: 120px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 6px;
  }

  /* -------- 选项卡片 -------- */
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 20px;
  }
  @media (max-width: 520px) {
    .options { grid-template-columns: 1fr; }
  }

  .option-card {
    position: relative;
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,255,255,0.10);
    border-radius: 16px;
    padding: 18px 16px;
    cursor: pointer;
    transition: all 0.25s ease;
    text-align: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .option-card:hover:not(.disabled) {
    background: rgba(255,255,255,0.11);
    border-color: rgba(255,255,255,0.22);
    transform: translateY(-2px);
  }
  .option-card:active:not(.disabled) {
    transform: scale(0.97);
  }
  .option-card .opt-text {
    font-size: 17px;
    color: #fff;
    font-weight: 500;
    line-height: 1.5;
    font-family: 'Courier New', 'PingFang SC', monospace;
  }
  .option-card .opt-sub {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    margin-top: 4px;
  }

  /* 状态样式 */
  .option-card.selected {
    border-color: #64b5f6;
    background: rgba(100,181,246,0.15);
  }
  .option-card.correct {
    border-color: #66bb6a;
    background: rgba(102,187,106,0.20);
    animation: popCorrect 0.5s ease;
  }
  .option-card.wrong {
    border-color: #ef5350;
    background: rgba(239,83,80,0.15);
    animation: shakeWrong 0.45s ease;
  }
  .option-card.reveal-correct {
    border-color: #66bb6a;
    background: rgba(102,187,106,0.12);
  }
  .option-card.disabled {
    cursor: default;
    opacity: 0.7;
  }
  .option-card.correct .opt-text,
  .option-card.reveal-correct .opt-text {
    color: #a5d6a7;
  }
  .option-card.wrong .opt-text {
    color: #ef9a9a;
  }

  /* 选项上的图标 */
  .option-card .icon-result {
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 18px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .option-card.correct .icon-result,
  .option-card.wrong .icon-result {
    opacity: 1;
  }

  /* -------- 反馈弹窗 -------- */
  .feedback-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 100;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(6px);
    animation: fadeIn 0.3s ease;
  }
  .feedback-overlay.show { display: flex; }

  .feedback-box {
    background: linear-gradient(145deg, #1a1a2e, #16213e);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 28px;
    padding: 40px 48px;
    max-width: 440px;
    width: 90%;
    text-align: center;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }
  .feedback-box .fb-icon { font-size: 64px; margin-bottom: 12px; }
  .feedback-box .fb-title {
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 8px;
  }
  .feedback-box .fb-desc {
    font-size: 15px;
    color: rgba(255,255,255,0.6);
    line-height: 1.7;
    margin-bottom: 24px;
  }
  .feedback-box .fb-btn {
    display: inline-block;
    padding: 12px 40px;
    border-radius: 40px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    color: #1a1a2e;
    background: linear-gradient(135deg, #f7971e, #ffd200);
  }
  .feedback-box .fb-btn:hover {
    transform: scale(1.04);
    box-shadow: 0 8px 30px rgba(247,151,30,0.35);
  }
  .feedback-box .fb-btn:active {
    transform: scale(0.96);
  }

  /* -------- 完成后 -------- */
  .complete-screen {
    display: none;
    text-align: center;
    padding: 30px 0 10px;
  }
  .complete-screen.show { display: block; }
  .complete-screen .trophy {
    font-size: 80px;
    margin-bottom: 12px;
  }
  .complete-screen h2 {
    font-size: 28px;
    color: #fff;
    margin-bottom: 6px;
  }
  .complete-screen p {
    color: rgba(255,255,255,0.6);
    font-size: 16px;
    margin-bottom: 20px;
  }
  .complete-screen .score-final {
    font-size: 48px;
    font-weight: 700;
    background: linear-gradient(135deg, #f7971e, #ffd200);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 24px;
  }
  .complete-screen .fb-btn {
    display: inline-block;
    padding: 14px 48px;
    border-radius: 40px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    color: #1a1a2e;
    background: linear-gradient(135deg, #f7971e, #ffd200);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .complete-screen .fb-btn:hover {
    transform: scale(1.04);
    box-shadow: 0 8px 30px rgba(247,151,30,0.35);
  }

  .hidden { display: none; }

  /* -------- 动画 -------- */
  @keyframes popCorrect {
    0% { transform: scale(1); }
    30% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  @keyframes shakeWrong {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes popIn {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  /* -------- Canvas 特效 -------- */
  #confetti-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 200;
  }

  /* 额外闪烁提示 */
  .glow-correct {
    box-shadow: 0 0 40px rgba(102,187,106,0.3);
  }

  /* -------- 难度选择 -------- */
  .mode-select {
    text-align: center;
    padding: 20px 0 8px;
  }
  .mode-select .mode-label {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 12px;
  }
  .mode-btns {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .mode-btns button {
    padding: 10px 22px;
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: #ccc;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-btns button:hover {
    background: rgba(255,255,255,0.12);
  }
  .mode-btns button.active {
    background: rgba(247,151,30,0.2);
    border-color: #f7971e;
    color: #ffd866;
  }

  .game-play-area { display: block; }
  .game-play-area.hidden { display: none; }

  /* -------- 知识背景按钮 -------- */
  .kb-btn-wrap {
    display: flex;
    justify-content: center;
    margin-top: 18px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .kb-btn-wrap button {
    padding: 10px 28px;
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.7);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.25s;
  }
  .kb-btn-wrap button:hover {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border-color: rgba(255,255,255,0.25);
    transform: translateY(-1px);
  }
  .kb-btn-wrap button.kb-active {
    background: rgba(100,181,246,0.18);
    border-color: #64b5f6;
    color: #90caf9;
  }
  .kb-btn-wrap button .badge-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 6px;
    background: #64b5f6;
    margin-right: 6px;
    vertical-align: middle;
  }

  /* -------- 知识面板遮罩 -------- */
  .knowledge-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 150;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    justify-content: center;
    align-items: flex-start;
    overflow-y: auto;
    padding: 20px;
    animation: fadeIn 0.25s ease;
  }
  .knowledge-overlay.show { display: flex; }

  .knowledge-panel {
    background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 24px;
    max-width: 760px;
    width: 100%;
    margin: 20px auto;
    padding: 28px 30px 36px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    max-height: calc(100vh - 40px);
    overflow-y: auto;
  }
  .knowledge-panel::-webkit-scrollbar { width: 4px; }
  .knowledge-panel::-webkit-scrollbar-track { background: transparent; }
  .knowledge-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

  .knowledge-panel .kp-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .knowledge-panel .kp-title {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .knowledge-panel .kp-close {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.6);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .knowledge-panel .kp-close:hover {
    background: rgba(255,255,255,0.12);
    color: #fff;
  }

  /* 分类标签 */
  .kp-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    padding-bottom: 12px;
  }
  .kp-tabs button {
    padding: 7px 16px;
    border-radius: 20px;
    border: 1px solid transparent;
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .kp-tabs button:hover {
    background: rgba(255,255,255,0.09);
    color: #ccc;
  }
  .kp-tabs button.active {
    background: rgba(247,151,30,0.18);
    border-color: #f7971e;
    color: #ffd866;
  }

  /* 知识内容 */
  .kp-content { min-height: 200px; }
  .kp-section { display: none; }
  .kp-section.active { display: block; }

  .kp-section .sec-title {
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 14px;
  }
  .kp-section .sec-sub {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 16px;
  }

  .knowledge-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    transition: background 0.2s;
  }
  .knowledge-card:hover {
    background: rgba(255,255,255,0.07);
  }
  .knowledge-card.has-img {
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .knowledge-card .kc-img {
    flex-shrink: 0;
    width: 80px;
    height: 80px;
    border-radius: 10px;
    overflow: hidden;
    background: rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .knowledge-card .kc-img img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .knowledge-card .kc-text {
    flex: 1;
    min-width: 0;
  }
  .knowledge-card .kc-title {
    font-size: 15px;
    font-weight: 600;
    color: #e0e0e0;
    margin-bottom: 4px;
    font-family: 'Courier New', 'PingFang SC', monospace;
  }
  .knowledge-card .kc-title .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 400;
    padding: 0 8px;
    border-radius: 10px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .tag-red    { background: rgba(239,83,80,0.2); color: #ef9a9a; }
  .tag-blue   { background: rgba(66,165,245,0.2); color: #90caf9; }
  .tag-green  { background: rgba(102,187,106,0.2); color: #a5d6a7; }
  .tag-yellow { background: rgba(255,200,50,0.2); color: #ffd866; }
  .tag-purple { background: rgba(171,71,188,0.2); color: #ce93d8; }

  .knowledge-card .kc-body {
    font-size: 13px;
    color: rgba(255,255,255,0.65);
    line-height: 1.7;
  }
  .knowledge-card .kc-body .formula {
    font-family: 'Courier New', monospace;
    color: #80cbc4;
    font-weight: 500;
  }
  .knowledge-card .kc-body .highlight-yellow {
    color: #ffd866;
  }
  .knowledge-card .kc-body .highlight-green {
    color: #a5d6a7;
  }

  /* 搜索框 */
  .kp-search {
    width: 100%;
    padding: 10px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.06);
    color: #fff;
    font-size: 14px;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.2s;
    box-sizing: border-box;
  }
  .kp-search::placeholder { color: rgba(255,255,255,0.3); }
  .kp-search:focus { border-color: #64b5f6; }

  .no-result {
    text-align: center;
    padding: 40px 0;
    color: rgba(255,255,255,0.3);
    font-size: 14px;
  }

  @media (max-width: 520px) {
    .knowledge-panel { padding: 20px 16px 28px; }
    .knowledge-panel .kp-title { font-size: 18px; }
    .kp-tabs button { font-size: 12px; padding: 6px 12px; }
  }

  /* -------- 排行榜按钮 (header) -------- */
  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .lb-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.06);
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lb-btn:hover {
    background: rgba(255,255,255,0.12);
    transform: scale(1.1);
  }

  /* -------- 连击显示 -------- */
  .combo-display {
    font-size: 13px;
    font-weight: 600;
    color: #ffd866;
    opacity: 0;
    transition: opacity 0.3s;
    white-space: nowrap;
  }
  .combo-display.show {
    opacity: 1;
    animation: comboPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes comboPop {
    0% { transform: scale(0.5); }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  /* -------- 答对浮动特效 -------- */
  .score-fly {
    position: fixed;
    z-index: 300;
    font-size: 48px;
    font-weight: 800;
    pointer-events: none;
    animation: scoreFlyUp 1s ease-out forwards;
  }
  @keyframes scoreFlyUp {
    0% { opacity: 1; transform: translateY(0) scale(0.5); }
    30% { opacity: 1; transform: translateY(-20px) scale(1.2); }
    100% { opacity: 0; transform: translateY(-120px) scale(0.8); }
  }

  /* 全屏闪光 */
  .flash-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 250;
    pointer-events: none;
    animation: flashFade 0.6s ease-out forwards;
  }
  @keyframes flashFade {
    0% { background: radial-gradient(circle, rgba(255,215,0,0.25) 0%, transparent 70%); opacity: 1; }
    100% { opacity: 0; }
  }

  /* -------- 排行榜内容 -------- */
  .lb-empty {
    text-align: center;
    padding: 40px 0;
    color: rgba(255,255,255,0.3);
    font-size: 14px;
  }
  .lb-entry {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 8px;
    transition: background 0.2s;
  }
  .lb-entry:hover { background: rgba(255,255,255,0.07); }
  .lb-entry .lb-rank {
    width: 28px;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .lb-entry .lb-rank.gold { color: #ffd700; }
  .lb-entry .lb-rank.silver { color: #c0c0c0; }

let _audioCtx = null;
function getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return _audioCtx;
}

function playCorrectSound() {
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;

    // 上行琶音：C5 → E5 → G5 → C6
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now + i * 0.1);
      gain.gain.linearRampToValueAtTime(0.25, now + i * 0.1 + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * 0.1);
      osc.stop(now + i * 0.1 + 0.35);
    });
  } catch (e) { /* 静默失败 */ }
}

function playWrongSound() {
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;

    // 低音下坠
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(150, now + 0.3);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.35);
  } catch (e) { /* 静默失败 */ }
}

function playCompleteSound() {
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;

    // 胜利 fanfare：C4 → E4 → G4 → C5 → E5 → G5 → C6
    const fanfare = [261.63, 329.63, 392.0, 523.25, 659.25, 783.99, 1046.5];
    fanfare.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t = now + i * 0.12;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.2, t + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.45);
    });
  } catch (e) { /* 静默失败 */ }
}

// ============================================================
//  Confetti / 粒子特效
// ============================================================
const canvas = $('confetti-canvas');
const ctx = canvas.getContext('2d');
let confettiPieces = [];
let confettiRunning = false;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class ConfettiPiece {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = canvas.height + 20;
    this.w = 6 + Math.random() * 8;
    this.h = 6 + Math.random() * 8;
    this.vx = (Math.random() - 0.5) * 6;
    this.vy = -(6 + Math.random() * 12);
    this.gravity = 0.12 + Math.random() * 0.08;
    this.color = ['#f7971e','#ffd200','#66bb6a','#42a5f5','#ab47bc','#ef5350','#26c6da','#ffa726'][Math.floor(Math.random()*8)];
    this.rotation = Math.random() * 360;
    this.rotSpeed = (Math.random() - 0.5) * 0.3;
    this.alpha = 1;
    this.life = 1;
    this.decay = 0.003 + Math.random() * 0.004;
  }
  update() {
    this.x += this.vx;
    this.vy += this.gravity;
    this.y += this.vy;
    this.rotation += this.rotSpeed;
    this.life -= this.decay;
    this.alpha = Math.max(0, this.life);
    return this.life > 0;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation * Math.PI / 180);
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
    ctx.restore();
  }
}

function fireConfetti(count = 120) {
  for (let i = 0; i < count; i++) {
    confettiPieces.push(new ConfettiPiece());
  }
  if (!confettiRunning) {
    confettiRunning = true;
    animateConfetti();
  }
}

function animateConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  confettiPieces = confettiPieces.filter(p => p.update());
  confettiPieces.forEach(p => p.draw());
  if (confettiPieces.length > 0) {
    requestAnimationFrame(animateConfetti);
  } else {
    confettiRunning = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

// 额外：粒子爆发（从某点）
function burstParticles(cx, cy, count = 40) {
  for (let i = 0; i < count; i++) {
    const p = new ConfettiPiece();
    p.x = cx;
    p.y = cy;
    const angle = Math.random() * 2 * Math.PI;
    const speed = 4 + Math.random() * 10;
    p.vx = Math.cos(angle) * speed;
    p.vy = Math.sin(angle) * speed - 2;
    p.gravity = 0.15;
    confettiPieces.push(p);
  }
  if (!confettiRunning) {
    confettiRunning = true;
    animateConfetti();
  }
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startGame(mode) {
  state.mode = mode;
  state.currentIndex = 0;
  state.score = 0;
  state.combo = 0;
  state.maxCombo = 0;
  state.answered = false;

  const bank = QUESTION_BANK[mode];
  state.questions = shuffleArray([...bank]);
  state.total = state.questions.length;

  levelBadge.textContent = MODE_TAGS[mode];
  levelBadge.style.display = '';
  document.querySelector('.stats').style.display = '';
  document.getElementById('comboDisplay').style.display = '';
  document.getElementById('comboDisplay').className = 'combo-display';
  document.getElementById('homeScreen').classList.add('hidden');
  gameArea.classList.remove('hidden');
  completeScreen.classList.remove('show');
  completeScreen.classList.add('hidden');

  renderQuestion();
}

function homeStartGame(mode) {
  document.getElementById('heroWelcome').textContent = '加油，' + (getCurrentUser() || '同学') + '！';
  startGame(mode);
}

function renderQuestion() {
  const q = state.questions[state.currentIndex];
  const idx = state.currentIndex;
  const total = state.total;

  qLabel.textContent = `第 ${idx + 1} / ${total} 题 · ${MODE_LABELS[state.mode]}`;
  qText.innerHTML = q.question;
  qHint.textContent = '💡 ' + q.hint;

  // 尝试显示相关的化学结构图
  const structImg = document.getElementById('structImg');
  if (structImg) {
    let imgUrl = '';
    if (state.mode === 'formula') {
      // 在选项中找到化学式并显示其结构
      for (const opt of q.options) {
        const url = getPubchemImg(opt);
        if (url) { imgUrl = url; break; }
      }
    } else {
      // 在题目文字中匹配化学式
      imgUrl = getPubchemImg(q.question) || '';
    }
    structImg.src = imgUrl;
    structImg.style.display = imgUrl ? 'block' : 'none';
  }

  scoreNum.textContent = state.score;
  totalNum.textContent = total;
  progressBar.style.width = ((idx / total) * 100) + '%';

  optContainer.innerHTML = '';
  state.answered = false;

  // 随机排列选项但记住正确索引
  const correctAnswer = q.options[q.correct];
  const shuffled = shuffleArray(q.options.map((text, i) => ({ text, origIndex: i })));
  const newCorrect = shuffled.findIndex(item => item.origIndex === q.correct);

  shuffled.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'option-card';
    card.innerHTML = `<div class="opt-text">${item.text}</div><div class="icon-result">${i === newCorrect ? '✓' : '✗'}</div>`;
    card.dataset.index = i;
    card.addEventListener('click', () => handleSelect(card, i, newCorrect, q));
    optContainer.appendChild(card);
  });
}

function handleSelect(card, selectedIdx, correctIdx, q) {
  if (state.answered) return;
  state.answered = true;

  const allCards = optContainer.querySelectorAll('.option-card');
  allCards.forEach(c => c.classList.add('disabled'));

  const isCorrect = selectedIdx === correctIdx;

  if (isCorrect) {
    state.score++;
    state.combo++;
    if (state.combo > state.maxCombo) state.maxCombo = state.combo;
    card.classList.add('correct');
    scoreNum.textContent = state.score;

    // 连击显示
    const comboEl = document.getElementById('comboDisplay');
    if (state.combo >= 2) {
      comboEl.textContent = `🔥 ${state.combo} 连击`;
      comboEl.className = 'combo-display show';
    } else {
      comboEl.textContent = '';
      comboEl.className = 'combo-display';
    }

    // 浮动 +N 文字
    const rect = card.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    const fly = document.createElement('div');
    fly.className = 'score-fly';
    fly.textContent = '✓ 正确!';
    fly.style.left = cx + 'px';
    fly.style.top = cy + 'px';
    fly.style.transform = 'translate(-50%, -50%)';
    fly.style.background = 'linear-gradient(135deg, #66bb6a, #a5d6a7)';
    fly.style.webkitBackgroundClip = 'text';
    fly.style.webkitTextFillColor = 'transparent';
    document.body.appendChild(fly);
    setTimeout(() => fly.remove(), 1000);

    // 全屏闪光
    const flash = document.createElement('div');
    flash.className = 'flash-overlay';
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 600);

    // 粒子特效
    burstParticles(cx, cy, 50);
    fireConfetti(80);
    playCorrectSound();

    showFeedback(true, q.explain);
  } else {
    state.combo = 0;
    document.getElementById('comboDisplay').className = 'combo-display';
    card.classList.add('wrong');
    allCards[correctIdx].classList.add('reveal-correct');
    playWrongSound();
    showFeedback(false, q.explain);
  }
}

function showFeedback(isCorrect, explain) {
  fbIcon.textContent = isCorrect ? '🎉' : '😅';
  fbTitle.textContent = isCorrect ? '回答正确！' : '再想想哦～';
  fbTitle.style.color = isCorrect ? '#a5d6a7' : '#ef9a9a';
  fbDesc.textContent = explain;

  feedbackOverlay.classList.add('show');
  feedbackOverlay.style.display = 'flex';
}

function closeFeedback() {
  feedbackOverlay.classList.remove('show');
  feedbackOverlay.style.display = 'none';

  state.currentIndex++;
  if (state.currentIndex >= state.total) {
    showComplete();
  } else {
    renderQuestion();
  }
}

fbBtn.addEventListener('click', closeFeedback);
feedbackOverlay.addEventListener('click', (e) => {
  if (e.target === feedbackOverlay) closeFeedback();
});

function showComplete() {
  gameArea.classList.add('hidden');
  completeScreen.classList.remove('hidden');
  completeScreen.classList.add('show');

  const score = state.score;
  const total = state.total;
  finalScore.textContent = `${score} / ${total}`;
  const pct = score / total;
  if (pct === 1) completeMsg.textContent = '🎯 满分通关！你是化学小达人！';
  else if (pct >= 0.8) completeMsg.textContent = '👏 非常棒！再接再厉！';
  else if (pct >= 0.6) completeMsg.textContent = '💪 还不错，多练练会更好！';
  else completeMsg.textContent = '📖 加油，复习一下再来挑战吧！';

  // 星级评价
  document.getElementById('starRating').textContent = getStarRating(pct);

  // 保存排行榜
  saveScore();

  // 胜利音效
  playCompleteSound();

  fireConfetti(200);
}

function resetGame() {
  completeScreen.classList.remove('show');
  completeScreen.classList.add('hidden');
  gameArea.classList.add('hidden');
  document.getElementById('homeScreen').classList.remove('hidden');
  levelBadge.style.display = 'none';
  document.querySelector('.stats').style.display = 'none';
  document.getElementById('comboDisplay').style.display = 'none';
  state.currentIndex = 0;
  state.score = 0;
  state.answered = false;
  progressBar.style.width = '0%';
  scoreNum.textContent = '0';
  loadHomeStats();
}

function getPubchemImg(title) {
  if (!title) return null;
  // 按长度从长到短匹配已知化学式（避免短式提前匹配）
  const formulas = Object.keys(PUBCHEM_CIDS).sort((a, b) => b.length - a.length);
  for (const formula of formulas) {
    if (title.includes(formula)) {
      return `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${PUBCHEM_CIDS[formula]}/PNG`;
    }
  }
  return null;
}

// ============================================================
//  知识背景控制
// ============================================================
let _kpActiveTab = 0;

function renderKnowledgeTabs() {
  const container = document.getElementById('kpTabs');
  container.innerHTML = KNOWLEDGE_DATA.map((cat, i) =>
    `<button class="${i === _kpActiveTab ? 'active' : ''}" onclick="switchKpTab(${i})">${cat.label}</button>`
  ).join('');
}

function renderKnowledgeContent(searchText) {
  const container = document.getElementById('kpContent');
  const cat = KNOWLEDGE_DATA[_kpActiveTab];
  if (!cat) return;
  const stext = searchText ? searchText.trim().toLowerCase() : '';

  let html = '';
  let hasAny = false;
  cat.sections.forEach(sec => {
    const filtered = stext
      ? sec.items.filter(item =>
          item.title.toLowerCase().includes(stext) ||
          item.body.toLowerCase().includes(stext)
        )
      : sec.items;
    if (stext && filtered.length === 0) return;
    hasAny = true;

    html += `<div class="sec-title">${sec.title}</div>`;
    if (stext && filtered.length < sec.items.length) {
      html += `<div class="sec-sub">找到 ${filtered.length}/${sec.items.length} 条</div>`;
    }
    filtered.forEach(item => {
      const hlBody = stext
        ? item.body.replace(new RegExp(`(${stext.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<span class="highlight-yellow">$1</span>')
        : item.body;
      const imgUrl = getPubchemImg(item.title);
      const imgHtml = imgUrl ? `<div class="kc-img"><img src="${imgUrl}" alt="${item.title}" loading="lazy"></div>` : '';
      html += `<div class="knowledge-card${imgUrl ? ' has-img' : ''}">${imgHtml}<div class="kc-text"><div class="kc-title">${item.title}</div><div class="kc-body">${hlBody}</div></div></div>`;
    });
  });

  if (!hasAny) {
    html = `<div class="no-result">😕 没有找到「${searchText}」相关的结果</div>`;
  }
  container.innerHTML = html;
}

function renderKnowledge() {
  renderKnowledgeTabs();
  renderKnowledgeContent('');
}

function switchKpTab(index) {
  _kpActiveTab = index;
  document.querySelectorAll('.kp-tabs button').forEach((btn, i) => {
    btn.classList.toggle('active', i === index);
  });
  const search = document.getElementById('kpSearch');
  search.value = '';
  renderKnowledgeContent('');
}

function filterKnowledge(value) {
  renderKnowledgeContent(value);
}

function openKnowledge() {
  renderKnowledge();
  knowledgeOverlay.classList.add('show');
  knowledgeOverlay.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeKnowledge() {
  knowledgeOverlay.classList.remove('show');
  knowledgeOverlay.style.display = 'none';
  document.body.style.overflow = '';
}

knowledgeOverlay.addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeKnowledge();
});

// ============================================================
//  键盘快捷键
// ============================================================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && feedbackOverlay.style.display === 'flex') {
    closeFeedback();
  }
  if (e.key === 'Escape') {
    if (knowledgeOverlay.classList.contains('show')) closeKnowledge();
    return;
  }
  if (e.key === 'r' || e.key === 'R') {
    if (completeScreen.classList.contains('show')) resetGame();
  }
});

window.addEventListener('DOMContentLoaded', () => {
  const saved = getSession();
  if (saved) {
    _currentUser = saved;
    showUserBadge(saved);
    document.getElementById('loginOverlay').classList.add('hidden');
    document.getElementById('homeScreen').classList.remove('hidden');

// ============================================================
//  账号系统
// ============================================================
let _authMode = 'register'; // login | register
let _currentUser = null;

function simpleHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const chr = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + chr;
    hash |= 0;
  }
  return 'h' + hash;
}

function getUsers() {
  try { return JSON.parse(localStorage.getItem('chemGameUsers') || '{}'); } catch (e) { return {}; }
}

function saveUsers(users) {
  try { localStorage.setItem('chemGameUsers', JSON.stringify(users)); } catch (e) {}
}

function getSession() {
  try { return localStorage.getItem('chemGameSession'); } catch (e) { return null; }
}

function setSession(username) {
  try {
    if (username) localStorage.setItem('chemGameSession', username);
    else localStorage.removeItem('chemGameSession');
  } catch (e) {}
}

function getCurrentUser() {
  if (_currentUser) return _currentUser;
  const s = getSession();
  if (s) _currentUser = s;
  return _currentUser;
}

function showUserBadge(username) {
  const badge = document.getElementById('userBadge');
  const avatar = document.getElementById('userAvatar');
  const nameEl = document.getElementById('userName');
  if (badge && avatar && nameEl && username) {
    avatar.textContent = username.charAt(0).toUpperCase();
    nameEl.textContent = username;
    badge.style.display = 'flex';
  }
}

function toggleAuthMode() {
  _authMode = _authMode === 'login' ? 'register' : 'login';
  document.getElementById('loginTitle').textContent = _authMode === 'login' ? '登录' : '注册';
  document.getElementById('loginSub').textContent = _authMode === 'login' ? '输入账号密码开始游戏' : '创建一个新账号';
  document.getElementById('loginBtn').textContent = _authMode === 'login' ? '进入游戏' : '注册并进入';
  document.getElementById('switchAuth').textContent = _authMode === 'login' ? '注册新账号' : '已有账号？去登录';
  document.getElementById('loginErr').textContent = '';
  document.getElementById('loginPass').value = '';
}

function handleLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');

  if (!username || !password) {
    errEl.textContent = '请输入用户名和密码';
    if (!username) document.getElementById('loginUser').classList.add('error');
    if (!password) document.getElementById('loginPass').classList.add('error');
    return;
  }
  if (username.length < 2) {
    errEl.textContent = '用户名至少2个字符';
    document.getElementById('loginUser').classList.add('error');
    return;
  }

  document.getElementById('loginUser').classList.remove('error');
  document.getElementById('loginPass').classList.remove('error');

  const users = getUsers();

  if (_authMode === 'register') {
    if (users[username]) {
      errEl.textContent = '用户名已存在，请直接登录';
      document.getElementById('loginUser').classList.add('error');
      return;
    }
    users[username] = simpleHash(password);
    saveUsers(users);
    _currentUser = username;
    setSession(username);
    closeLogin();
  } else {
    if (!users[username]) {
      errEl.textContent = '用户不存在，请先注册';
      document.getElementById('loginUser').classList.add('error');
      return;
    }
    if (users[username] !== simpleHash(password)) {
      errEl.textContent = '密码错误';
      document.getElementById('loginPass').classList.add('error');
      return;
    }
    _currentUser = username;
    setSession(username);
    closeLogin();
  }
}

function closeLogin() {
  document.getElementById('loginOverlay').classList.add('hidden');
  showUserBadge(_currentUser);
  document.getElementById('homeScreen').classList.remove('hidden');
  document.getElementById('levelBadge').style.display = 'none';
  document.querySelector('.stats').style.display = 'none';
  document.getElementById('comboDisplay').style.display = 'none';
  document.querySelector('.home-screen').classList.remove('hidden');
  loadHomeStats();
}

function logoutUser() {
  if (!confirm('确定退出登录吗？')) return;
  _currentUser = null;
  setSession(null);
  document.getElementById('userBadge').style.display = 'none';
  resetGame();
  document.getElementById('homeScreen').classList.add('hidden');
  document.getElementById('loginOverlay').classList.remove('hidden');
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  document.getElementById('loginErr').textContent = '';
  _authMode = 'register';
  document.getElementById('loginTitle').textContent = '注册';
  document.getElementById('loginSub').textContent = '创建一个新账号';
  document.getElementById('loginBtn').textContent = '注册并进入';
  document.getElementById('switchAuth').textContent = '已有账号？去登录';
}

// 登录窗口回车提交
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !document.getElementById('loginOverlay').classList.contains('hidden')) {
    handleLogin();
  }
});

// ============================================================
//  主界面统计
// ============================================================
function loadHomeStats() {
  const user = getCurrentUser();
  if (!user) return;
  const welcome = document.getElementById('heroWelcome');
  welcome.textContent = '欢迎回来，' + user + '！';
  try {
    const scores = JSON.parse(localStorage.getItem('chemGameLB') || '[]');
    const myScores = scores.filter(s => s.user === user);
    const totalQ = myScores.reduce((sum, s) => sum + s.total, 0);
    const bestPct = myScores.length > 0 ? Math.max(...myScores.map(s => s.pct)) : 0;
    const bestCombo = myScores.length > 0 ? Math.max(...myScores.map(s => s.combo || 0)) : 0;
    document.getElementById('hsTotal').textContent = totalQ;
    document.getElementById('hsBest').textContent = bestPct > 0 ? bestPct + '%' : '-';
    document.getElementById('hsCombo').textContent = bestCombo;
  } catch (e) {}
}

// ============================================================
//  排行榜
// ============================================================
function getStarRating(pct) {
  if (pct >= 1) return '⭐⭐⭐';
  if (pct >= 0.8) return '⭐⭐';
  if (pct >= 0.6) return '⭐';
  return '☆';
}

function saveScore() {
  try {
    const scores = JSON.parse(localStorage.getItem('chemGameLB') || '[]');
    scores.push({
      user: getCurrentUser() || '匿名',
      score: state.score,
      total: state.total,
      pct: Math.round(state.score / state.total * 100),
      mode: MODE_LABELS[state.mode],
      combo: state.maxCombo,
      date: new Date().toLocaleDateString('zh-CN')
    });
    scores.sort((a, b) => b.pct - a.pct || b.score - a.score);
    localStorage.setItem('chemGameLB', JSON.stringify(scores.slice(0, 20)));
  } catch (e) {
    // localStorage 不可用时静默失败
  }
}

function getScores() {
  try {
    return JSON.parse(localStorage.getItem('chemGameLB') || '[]');
  } catch (e) {
    return [];
  }
}

function openLeaderboard() {
  renderLeaderboard();
  const overlay = document.getElementById('leaderboardOverlay');
  overlay.classList.add('show');
  overlay.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeLeaderboard() {
  const overlay = document.getElementById('leaderboardOverlay');
  overlay.classList.remove('show');
  overlay.style.display = 'none';
  document.body.style.overflow = '';
}

function renderLeaderboard() {
  const container = document.getElementById('lbContent');
  const scores = getScores();

  if (scores.length === 0) {
    container.innerHTML = '<div class="lb-empty">🏆 暂无记录<br><span style="font-size:13px;color:rgba(255,255,255,0.2)">完成一轮答题后自动记录</span></div>';
    return;
  }

  let html = '';
  scores.slice(0, 10).forEach((entry, i) => {
    const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : 'normal';
    const rankLabel = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i + 1}`;
    html += `
      <div class="lb-entry">
        <div class="lb-rank ${rankClass}">${rankLabel}</div>
        <div class="lb-info">
          <div class="lb-score">${entry.user || '匿名'} · ${entry.score}/${entry.total}<span class="lb-pct">${entry.pct}%</span></div>
          <div class="lb-meta">${entry.mode}${entry.combo > 1 ? ' · 最大连击 ' + entry.combo : ''} · ${entry.date}</div>
        </div>
        <div class="lb-stars">${getStarRating(entry.pct / 100)}</div>
      </div>`;
  });

  html += '<button class="lb-clear" onclick="clearLeaderboard()">🗑️ 清空记录</button>';
  container.innerHTML = html;
}

function clearLeaderboard() {
  if (confirm('确定要清空所有排行榜记录吗？')) {
    localStorage.removeItem('chemGameLB');
    renderLeaderboard();
  }
}

// 排行榜遮罩点击关闭
document.getElementById('leaderboardOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeLeaderboard();
});
</script>
